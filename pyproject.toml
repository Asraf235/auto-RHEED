[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-rheed"
version = "0.1.0"
description = "Auto RHEED — RHEED data analysis suite: core domain logic, Flask web app, and MCP server"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "h5py",
    "scipy",
    "flask",
    "mcp>=1,<2",
    "requests",
]

[project.optional-dependencies]
ai = [
    "scikit-learn>=1.4,<2",
]
dinov3 = [
    "scikit-learn>=1.4,<2",
    "torch>=2.2,<3",
    "transformers>=4.56,<6",
]
yolo = [
    "lap>=0.5.12,<1",
    "scikit-learn>=1.4,<2",
    "ultralytics>=8.3,<9",
]
ai-all = [
    "lap>=0.5.12,<1",
    "scikit-learn>=1.4,<2",
    "torch>=2.2,<3",
    "transformers>=4.56,<6",
    "ultralytics>=8.3,<9",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"THIRD_PARTY_LICENSES" = ["THIRD_PARTY_LICENSES/*.txt"]
