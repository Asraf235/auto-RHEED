[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-rheed"
version = "0.1.0"
description = "Auto RHEED — RHEED data analysis suite: core domain logic, Flask web app, and MCP server"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python",
    "h5py",
    "scipy",
    "flask",
    "mcp",
]

[tool.setuptools.packages.find]
where = ["src"]
